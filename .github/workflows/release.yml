# A release, from a pushed tag vMAJOR.MINOR.PATCH[-suffix] (any suffix
# makes it a pre-release): builds every package (build.yml, no secret),
# signs the Android packages (the `release` environment, whose secrets
# hold the release key; this job runs no build), then creates the release
# as a draft with the packages, their SHA256SUMS and their build provenance
# attestations, its notes the version's section of CHANGELOG.md. Publish
# the draft by hand on GitHub. RELEASING.md describes the whole process and
# the repository's settings it relies on.
#
# The Android version code is this workflow's run number: it grows with
# every release (keep this file's name: a renamed workflow counts from 1
# again).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Check the tag and the changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag ${TAG} is not vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi
          if ! grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"## [${version}]\""
            exit 1
          fi
          {
            echo "version=${version}"
            echo "version-code=${RUN_NUMBER}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      version-code: ${{ needs.version.outputs.version-code }}

  sign:
    needs: [version, build]
    runs-on: ubuntu-24.04
    # The environment's secrets: the release key (RELEASING.md). Its
    # deployment rule admits the v* tags only.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: android/sign_apk.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned
      - name: Install apksigner
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.1.0" > /dev/null
      - name: Sign
        env:
          VERSION: ${{ needs.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SH_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SH_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SH_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export SH_RELEASE_KEYSTORE="${RUNNER_TEMP}/release.p12"
          trap 'rm -f "${SH_RELEASE_KEYSTORE}"' EXIT
          base64 -d <<< "${KEYSTORE_BASE64}" > "${SH_RELEASE_KEYSTORE}"
          mkdir -p signed
          for apk in unsigned/*-unsigned.apk; do
            name="$(basename "${apk}" -unsigned.apk)"
            android/sign_apk.sh "${apk}" "signed/${name}-${VERSION}-android.apk"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: signed/*
          if-no-files-found: error

  publish:
    needs: [version, build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
      id-token: write # the attestations' signing certificate
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          rm -f -- *-unsigned.apk
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.version-code }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # The notes: the version's section of CHANGELOG.md, without its
          # heading, and the Android version code (not derived from the
          # version: F-Droid's recipe needs it).
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\nAndroid version code: %s\n' "${VERSION_CODE}" >> notes.md
          flags=(--draft --verify-tag --title "Silent Heritage ${VERSION}" --notes-file notes.md)
          if [[ "${PRERELEASE}" == true ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            # A re-run: the files replaced, the release left as it is.
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}" dist/*
          fi
